services:
  addon:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - '7000:7000'
    environment:
      ADDON_BASE_URL: ${ADDON_BASE_URL:?Set ADDON_BASE_URL to the public HTTPS URL}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY}
      SCRAPE_PROWLARR: ${SCRAPE_PROWLARR:-false}
      PROWLARR_URL: ${PROWLARR_URL:-http://127.0.0.1:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      PROWLARR_INDEXERS: '${PROWLARR_INDEXERS:-[]}'
      SCRAPE_JACKETT: ${SCRAPE_JACKETT:-false}
      JACKETT_URL: ${JACKETT_URL:-http://127.0.0.1:9117}
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_INDEXERS: '${JACKETT_INDEXERS:-[]}'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    volumes:
      - addon-data:/data
    tmpfs:
      - /tmp

volumes:
  addon-data:
